<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerHub - Login & Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">CareerHub | Student Portal</div>
  </header>

  <main class="auth-wrapper">
    <!-- Registration Form -->
    <div class="auth-card" id="registerBox">
      <h2>Student Registration</h2>
      <form id="registerForm">
        <div class="input-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="e.g. Rahul Sharma" required>
        </div>
        <div class="input-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="student@example.com" required>
        </div>
        <div class="input-group">
          <label for="regCourse">Course / Stream</label>
          <select id="regCourse">
            <option value="SY BCA">SY BCA</option>
            <option value="TY BCA">TY BCA</option>
            <option value="B.Sc CS">B.Sc Computer Science</option>
            <option value="MCA">MCA</option>
          </select>
        </div>
        <div class="input-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn-primary">Register</button>
      </form>
      <div class="toggle-link">
        Already registered? <a id="showLogin">Login here</a>
      </div>
    </div>

    <!-- Login Form -->
    <div class="auth-card" id="loginBox" style="display: none;">
      <h2>Student Login</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="student@example.com" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <div class="toggle-link">
        Don't have an account? <a id="showRegister">Register here</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
