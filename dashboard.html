<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerHub - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">CareerHub Dashboard</div>
    <div class="nav-links">
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="dashboard-container">
    <div class="welcome-banner">
      <h2 id="studentWelcome">Welcome, Student!</h2>
      <p id="studentEmailInfo" style="color: #64748b; font-size: 14px;"></p>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="renderListings('all')">All Opportunities</button>
      <button class="filter-btn" onclick="renderListings('job')">Full-Time Jobs</button>
      <button class="filter-btn" onclick="renderListings('internship')">Internships</button>
    </div>

    <!-- Dynamic Listings Container -->
    <div class="cards-grid" id="listingsContainer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
